name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Offline repository hygiene (not scientific validation)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Test the repository checker
        run: python -m unittest discover -s tests -v
      - name: Check notebooks, local links, SVG and credential literals
        run: python scripts/check_repository.py
