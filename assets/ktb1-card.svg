<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="198" viewBox="0 0 1120 198" role="img" aria-labelledby="title desc">
  <title id="title">KTB1: a digital twin playground for the case study</title>
  <desc id="desc">Explore KTB1, the MATLAB and Simulink benchmark for continuous biomanufacturing developed by Boskabadi and colleagues. Its dynamic inventories provide the foreground data for the dLCA case study.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#102430"/><stop offset="1" stop-color="#171f38"/></linearGradient>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect x="1" y="1" width="1118" height="196" rx="18" fill="url(#card)" stroke="#38536b"/>
  <rect x="1" y="32" width="4" height="134" rx="2" fill="#5ad5c5"/>
  <rect x="33" y="32" width="244" height="27" rx="13.5" fill="#20413f"/>
  <text x="49" y="51" font-size="12" font-weight="700" letter-spacing="1.5" fill="#a8f0e3">DIGITAL TWIN PLAYGROUND</text>
  <text x="33" y="108" font-size="34" font-weight="700" fill="#eff6ff">KTB1</text>
  <text x="146" y="107" font-size="22" fill="#c4d1e4">Boskabadi et al.</text>
  <text x="33" y="145" font-size="18" fill="#b6c7da">Continuous biomanufacturing · MATLAB/Simulink</text>
  <text x="33" y="174" font-size="15" fill="#92a9c1">Simulation data for the dLCA case study</text>
  <rect x="764" y="65" width="320" height="65" rx="12" fill="#25394d" stroke="#607b8f"/>
  <text x="786" y="104" font-size="19" font-weight="700" fill="#d2f7ee">Explore KTB1</text>
  <path d="M1046 105 L1065 86 M1050 86 H1065 V101" fill="none" stroke="#83e9d3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
