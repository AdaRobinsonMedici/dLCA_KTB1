<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">dLCA — Dynamic LCA for continuous operations</title>
  <desc id="description">General framework, KTB1 demonstration. A decorative temporal grid and signal motif illustrates time-resolved assessment; it does not depict research data or a control loop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#122d39"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44b8b2"/>
      <stop offset="1" stop-color="#a8efd7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#27414d"/>
  <rect x="48" y="45" width="5" height="54" rx="2.5" fill="#86e0c6"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="95" fill="#f4f8fa" font-size="64" font-weight="700" letter-spacing="-2">dLCA</text>
    <text x="48" y="154" fill="#f4f8fa" font-size="33" font-weight="600" letter-spacing="-0.5">Dynamic LCA for</text>
    <text x="48" y="195" fill="#f4f8fa" font-size="33" font-weight="600" letter-spacing="-0.5">continuous operations</text>
    <text x="49" y="233" fill="#b7cbd2" font-size="18">General framework · KTB1 demonstration</text>

    <g font-size="11" font-weight="700" letter-spacing="1.2">
      <rect x="48" y="284" width="133" height="30" rx="15" fill="#1a3f47" stroke="#37615f"/>
      <text x="114.5" y="304" fill="#b1ecd9" text-anchor="middle">FRAMEWORK</text>
      <path d="M191 299h17m-5-4 5 4-5 4" fill="none" stroke="#63828d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="220" y="284" width="127" height="30" rx="15" fill="#142b3a" stroke="#35505e"/>
      <text x="283.5" y="304" fill="#d0dfe4" text-anchor="middle">WORKFLOW</text>
      <path d="M357 299h17m-5-4 5 4-5 4" fill="none" stroke="#63828d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="386" y="284" width="165" height="30" rx="15" fill="#142b3a" stroke="#35505e"/>
      <text x="468.5" y="304" fill="#d0dfe4" text-anchor="middle">DEMONSTRATION</text>
    </g>

    <g aria-hidden="true">
      <rect x="676" y="45" width="476" height="269" rx="14" fill="#0d2231" fill-opacity="0.66" stroke="#2b4855"/>
      <text x="704" y="79" fill="#a7c8d0" font-size="11" font-weight="700" letter-spacing="1.6">TIME-RESOLVED ASSESSMENT</text>
      <g stroke="#28424e" stroke-width="1" opacity="0.7">
        <path d="M704 112h420M704 152h420M704 192h420M704 232h420"/>
        <path d="M744 108v142M804 108v142M864 108v142M924 108v142M984 108v142M1044 108v142M1104 108v142"/>
      </g>
      <path d="M704 186H746V164H788V180H830V136H872V157H914V129H956V149H998V119H1040V141H1082V126H1124" fill="none" stroke="#547e94" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M704 213C722 213 729 193 746 193S770 215 788 207S812 164 830 164S854 190 872 184S896 152 914 159S938 184 956 177S980 149 998 151S1022 170 1040 165S1064 143 1082 146S1106 155 1124 148" fill="none" stroke="url(#signal)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="1124" cy="148" r="5" fill="#a8efd7"/>
      <path d="M704 263h420" stroke="#365460" stroke-width="1"/>
      <text x="704" y="290" fill="#839fae" font-size="12">Dynamic inputs</text>
      <path d="M817 286h143m-6-4 6 4-6 4" fill="none" stroke="#537780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1124" y="290" fill="#b0dccf" font-size="12" text-anchor="end">Impact signals</text>
    </g>
  </g>
